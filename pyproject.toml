[project]
name = "mockyfast"
version = "0.2.0"
description = "CLI tool to serve API mocks from YAML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  # The configuration models; FastAPI already pulls it in, but this package
  # imports it directly.
  "pydantic>=2",
  "uvicorn",
  "typer",
  "pyyaml",
  # uvicorn's fallback reloader only watches *.py, so `serve --reload` needs this.
  "watchfiles",
]

[project.optional-dependencies]
dev = [
  "pytest",
  # `mkf schema` and `mkf openapi` publish documents; the tests check both
  # are the real thing rather than merely well-formed JSON.
  "jsonschema",
  "openapi-spec-validator",
  "pytest-cov",
  "httpx",
  "ruff",
]

[project.scripts]
mockyfast = "mockyfast.cli:app"
mkf = "mockyfast.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as argument defaults; that is its API.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
