[project]
name = "mockyfast"
version = "0.2.0"
description = "CLI tool to serve API mocks from YAML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "typer",
  "pyyaml",
  # uvicorn's fallback reloader only watches *.py, so `serve --reload` needs this.
  "watchfiles",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "httpx",
  "ruff",
]

[project.scripts]
mockyfast = "mockyfast.cli:app"
mkf = "mockyfast.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
